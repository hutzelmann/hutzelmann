name: readme

on:
  schedule:
    # Daily, off the hour: scheduled runs bunch up and get delayed on the hour.
    #
    # GitHub disables scheduled workflows after 60 days without repository
    # activity. This job commits only when the output changes, so a long quiet
    # stretch can switch the schedule off. GitHub emails a warning first, and
    # `gh workflow run readme.yml` revives it.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch repository data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo list hutzelmann --limit 100 \
            --json name,description,stargazerCount,isPrivate,isFork,repositoryTopics \
            > "$RUNNER_TEMP/repos.json"

      - name: Render
        run: python3 scripts/generate.py "$RUNNER_TEMP/repos.json" > README.md

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No change."
            exit 0
          fi
          git config user.name "Thomas Hutzelmann"
          git config user.email "18736645+hutzelmann@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh generated page"
          git push
